[project]
name = "sanni-yakuma"
version = "0.1.0"
description = "An AI exorcism for codebases, based on the Sri Lankan Sanni Yakuma ritual"
authors = [
    { name = "Chamod Dhananjaya", email = "dhananjayachamod0754@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lizard>=1.24.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
sanni = "sanni_yakuma.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
